<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>屯門兆康路線 巴士到站時間表</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e6ed;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .header {
      background: #c62828;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.85; }
    
    .select-container {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .stop-select {
      background: white;
      color: #c62828;
      border: 1px solid #cbd5e0;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      width: 90%;
      max-width: 340px;
      text-align: center;
    }

    .update-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .eta-list { padding: 16px; }
    .stop-group-title {
      font-size: 14px;
      font-weight: bold;
      color: #c62828;
      margin: 16px 0 10px 4px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
    }
    .stop-group-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      background: #e60012;
      margin-right: 8px;
      border-radius: 2px;
    }
    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff5f5;
      border: 1.5px solid #ff5252;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .route-item.ctb {
      background: #fffdf0;
      border-color: #ffd100;
    }
    .route-item.lwb {
      background: #fffaf0;
      border-color: #f97316;
    }
    .route-badge { display: flex; flex-direction: column; align-items: flex-start; min-width: 65px; }
    .route-number { font-size: 20px; font-weight: 800; color: #1a365d; }
    .company-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-top: 2px; }
    .ctb-tag { background-color: #ffd100; color: #333; }
    .kmb-tag { background-color: #e60012; color: white; }
    .lwb-tag { background-color: #f97316; color: white; }
    
    .route-info { flex: 1; padding: 0 12px; }
    .dest-name { font-size: 14px; font-weight: bold; color: #2d3748; }
    .eta-times { text-align: right; min-width: 125px; }
    .primary-eta { font-size: 15px; font-weight: bold; color: #c62828; }
    .secondary-eta { font-size: 11px; color: #718096; margin-top: 3px; }
    .status-msg { text-align: center; padding: 24px; color: #718096; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>屯門兆康路線 巴士到站時間表</h1>
      <p>📍 選擇巴士站觀測全路線到站時間</p>

      <div class="select-container">
        <select id="stopSelector" class="stop-select" onchange="loadAllEta()">
          <option value="ALL">📍 所有車站 (一次看全部)</option>
          <option value="SIU_HONG_SOUTH">兆康路 (近中學，南行)</option>
          <option value="YAN_TIN_NORTH">欣田邨 (近欣田邨，北行)</option>
          <option value="77FB32597CCD30F5">兆康苑總站</option>
        </select>
      </div>

      <button class="update-btn" onclick="loadAllEta()">🔄 更新到站時間</button>
    </div>

    <div class="eta-list" id="etaContainer">
      <div class="status-msg">正在載入班次...</div>
    </div>
  </div>

  <script>
    const TARGET_STOPS = [
      { id: '003209', kmbId: 'E16D49ECA536ECC6', name: '兆康路 (近中學，南行)', key: 'SIU_HONG_SOUTH', lwbIds: new Set(['E16D49ECA536ECC6', '003209']) },
      { id: '003207', kmbId: '580D52F4D93CAD9B', name: '欣田邨 (近欣田邨，北行)', key: 'YAN_TIN_NORTH', lwbIds: new Set(['580D52F4D93CAD9B', '003207']) },
      { id: '', kmbId: '77FB32597CCD30F5', name: '兆康苑總站', key: '77FB32597CCD30F5', lwbIds: new Set(['77FB32597CCD30F5']) }
    ];

    const LWB_ROUTES = ['A34', 'E33P', 'E36C', 'NA33'];

    const ALL_ROUTES = [
      'A34', 'E33P', 'E36C', 'NA33', '67M', '67X', '261P', '267X', '960C', 'N260', 'P960', 'SP5A',
      '50', '50R', '55', '56', '56A', '950', '955', 'B3A', 'N50', 'SP5B',
      '52X', '57M', '58M', '58X', '59M', '59X', '60M', '60X', '61M', '61X', '62X', '63X', 
      '66M', '66X', '258D', '259D', '260X', '263', '962X', 'N962'
    ];

    // 啟動時先下載龍運專屬路線的站點，獲取確切的 LWB Stop ID
    async function initLwbStops() {
      try {
        const promises = [];
        LWB_ROUTES.forEach(route => {
          ['outbound', 'inbound'].forEach(bound => {
            promises.push(
              fetch(`https://data.etabus.gov.hk/v1/transport/lwb/route-stop/${route}/${bound}/1`)
                .then(res => res.ok ? res.json() : { data: [] })
                .catch(() => ({ data: [] }))
            );
          });
        });

        const results = await Promise.all(promises);
        results.forEach(res => {
          (res.data || []).forEach(st => {
            TARGET_STOPS.forEach(target => {
              if (st.stop === target.kmbId || st.stop === target.id) {
                target.lwbIds.add(st.stop);
              }
            });
          });
        });
      } catch (err) {
        console.error('初始化龍運車站失敗:', err);
      } finally {
        loadAllEta();
      }
    }

    // 城巴 ETA 查詢
    async function fetchCtbEta(stopId, route) {
      if (!stopId || stopId.length > 6) return [];
      try {
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.data || []).filter(i => i.eta).map(i => ({
          ...i,
          co: 'CTB',
          dest_tc: i.dest_tc
        }));
      } catch (err) {
        return [];
      }
    }

    // 查詢九巴及龍運 ETA
    async function fetchKmbLwbStopEta(stopObj) {
      const promises = [];

      // 1. 查詢九巴 API
      if (stopObj.kmbId) {
        promises.push(
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopObj.kmbId}`)
            .then(res => res.ok ? res.json() : { data: [] })
            .then(data => (data.data || []).filter(i => i.eta).map(i => ({
              ...i,
              co: LWB_ROUTES.includes(i.route) ? 'LWB' : 'KMB',
              dest_tc: i.dest_tc || '目的地'
            })))
            .catch(() => [])
        );
      }

      // 2. 查詢龍運專屬 API
      stopObj.lwbIds.forEach(id => {
        if (id) {
          promises.push(
            fetch(`https://data.etabus.gov.hk/v1/transport/lwb/stop-eta/${id}`)
              .then(res => res.ok ? res.json() : { data: [] })
              .then(data => (data.data || []).filter(i => i.eta).map(i => ({
                ...i,
                co: 'LWB',
                dest_tc: i.dest_tc || '目的地'
              })))
              .catch(() => [])
          );
        }
      });

      const results = await Promise.all(promises);
      let combined = [];
      results.forEach(list => { combined = combined.concat(list); });
      return combined;
    }

    async function fetchStopAllRoutes(stopObj) {
      const ctbPromises = ALL_ROUTES.map(r => fetchCtbEta(stopObj.id, r));
      const kmbLwbPromise = fetchKmbLwbStopEta(stopObj);

      const [ctbResults, kmbLwbResults] = await Promise.all([
        Promise.all(ctbPromises),
        kmbLwbPromise
      ]);

      let combined = [];
      ctbResults.forEach(list => { combined = combined.concat(list); });
      combined = combined.concat(kmbLwbResults);

      return combined;
    }

    async function loadAllEta() {
      const container = document.getElementById('etaContainer');
      const selectedKey = document.getElementById('stopSelector').value;
      const now = new Date();

      try {
        const filteredStops = selectedKey === 'ALL' 
          ? TARGET_STOPS 
          : TARGET_STOPS.filter(s => s.key === selectedKey);

        const promises = filteredStops.map(stopObj => fetchStopAllRoutes(stopObj));
        const results = await Promise.all(promises);

        let html = '';

        filteredStops.forEach((stop, index) => {
          const rawList = results[index] || [];

          html += `<div class="stop-group-title">${stop.name}</div>`;

          if (rawList.length > 0) {
            const routeMap = {};
            rawList.forEach(item => {
              if (!routeMap[item.route]) routeMap[item.route] = [];
              routeMap[item.route].push(item);
            });

            const routes = Object.keys(routeMap).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

            routes.forEach(routeName => {
              const matched = routeMap[routeName];
              
              // 時間與重複濾除
              const uniqueList = [];
              const seenTimes = new Set();
              matched.forEach(item => {
                const key = `${item.route}_${item.eta}`;
                if (!seenTimes.has(key)) {
                  seenTimes.add(key);
                  uniqueList.push(item);
                }
              });

              uniqueList.sort((a, b) => new Date(a.eta) - new Date(b.eta));

              const bus1 = uniqueList[0];
              const bus2 = uniqueList[1];

              const diff1 = Math.max(0, Math.round((new Date(bus1.eta) - now) / 60000));
              const timeStr1 = new Date(bus1.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

              let primaryStr = diff1 === 0 ? '即將到站' : `${diff1} 分鐘 <span style="font-size:11px;font-weight:normal;">(${timeStr1})</span>`;
              let secondEtaStr = '暫無次班';
              if (bus2 && bus2.eta) {
                const diff2 = Math.max(0, Math.round((new Date(bus2.eta) - now) / 60000));
                const timeStr2 = new Date(bus2.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                secondEtaStr = `次班: ${timeStr2} (${diff2}分)`;
              }

              let companyClass = 'kmb';
              let tagText = '九巴';
              let tagClass = 'kmb-tag';

              if (bus1.co === 'LWB') {
                companyClass = 'lwb';
                tagText = '龍運';
                tagClass = 'lwb-tag';
              } else if (bus1.co === 'CTB') {
                companyClass = 'ctb';
                tagText = '城巴';
                tagClass = 'ctb-tag';
              }

              html += `
                <div class="route-item ${companyClass}">
                  <div class="route-badge">
                    <span class="route-number">${routeName}</span>
                    <span class="company-tag ${tagClass}">${tagText}</span>
                  </div>
                  <div class="route-info">
                    <div class="dest-name">往 ${bus1.dest_tc || '目的地'}</div>
                  </div>
                  <div class="eta-times">
                    <div class="primary-eta">${primaryStr}</div>
                    <div class="secondary-eta">${secondEtaStr}</div>
                  </div>
                </div>
              `;
            });
          } else {
            html += `<div class="status-msg" style="padding: 12px; font-size: 13px;">暫無即時班次資料</div>`;
          }
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-msg">載入失敗，請稍後重試</div>`;
      }
    }

    // 啟動程序
    initLwbStops();
    setInterval(loadAllEta, 15000);
  </script>
</body>
</html>
