<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>往屯門/兆康 巴士到站時間表</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .nav-bar {
      display: flex;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      gap: 8px;
    }
    .nav-link {
      flex: 1;
      padding: 8px;
      text-align: center;
      background: #e2e8f0;
      color: #4a5568;
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }
    .nav-link.active {
      background: #e60012;
      color: white;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e6ed;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .header {
      background: #9b2c2c;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.85; }
    
    .select-container {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .stop-select {
      background: white;
      color: #742a2a;
      border: 1px solid #cbd5e0;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .update-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    .eta-list { padding: 16px; }
    .stop-group-title {
      font-size: 14px;
      font-weight: bold;
      color: #742a2a;
      margin: 16px 0 10px 4px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
    }
    .stop-group-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      background: #e60012;
      margin-right: 8px;
      border-radius: 2px;
    }
    .route-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff5f5;
      border: 1.5px solid #ff5252;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .route-item.ctb {
      background: #fffdf0;
      border-color: #ffd100;
    }
    .route-badge { display: flex; flex-direction: column; align-items: flex-start; min-width: 65px; }
    .route-number { font-size: 20px; font-weight: 800; color: #742a2a; }
    .company-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-top: 2px; }
    .ctb-tag { background-color: #ffd100; color: #333; }
    .kmb-tag { background-color: #e60012; color: white; }
    
    .route-info { flex: 1; padding: 0 12px; }
    .dest-name { font-size: 14px; font-weight: bold; color: #2d3748; }
    .eta-times { text-align: right; min-width: 125px; }
    .primary-eta { font-size: 15px; font-weight: bold; color: #c53030; }
    .secondary-eta { font-size: 11px; color: #718096; margin-top: 3px; }
    .status-msg { text-align: center; padding: 24px; color: #718096; font-size: 14px; }

    /* 底部偵測器通用樣式 */
    .debug-section {
      background: #ffffff;
      border-radius: 16px;
      border: 2px dashed #3182ce;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      margin-top: 10px;
    }
    .debug-title {
      font-size: 15px;
      font-weight: bold;
      color: #2b6cb0;
      text-align: center;
      margin-bottom: 12px;
    }
    .debug-sub-title {
      font-size: 13px;
      font-weight: bold;
      background: #ebf8ff;
      color: #2b6cb0;
      padding: 4px 8px;
      margin: 10px 0 6px 0;
      border-radius: 4px;
    }
    .debug-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .debug-row.highlight {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
      font-weight: bold;
    }
    .stop-id-tag {
      font-family: monospace;
      color: #2b6cb0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 頂部切換頁面導航條 -->
  <div class="nav-bar">
    <a href="index.html" class="nav-link">🚌 黃竹坑 ↔ 銅鑼灣</a>
    <a href="tuenmun.html" class="nav-link active">⛰️ 往屯門/兆康專頁</a>
  </div>

  <div class="card">
    <div class="header">
      <h1>往屯門/兆康 巴士到站時間表</h1>
      <p>📍 選擇巴士站觀測全路線到站時間</p>

      <div class="select-container">
        <select id="stopSelector" class="stop-select" onchange="loadAllEta()">
          <option value="ALL">📍 所有車站 (一次看全部)</option>
          <option value="B17A07239E3E576E">堅拿道東 (往屯門過海線)</option>
          <option value="001185">屯門公路轉車站 (往屯門方向)</option>
        </select>
      </div>

      <button class="update-btn" onclick="loadAllEta()">🔄 更新到站時間</button>
    </div>

    <div class="eta-list" id="etaContainer">
      <div class="status-msg">正在載入班次...</div>
    </div>
  </div>

  <!-- 底部 67M, 67X (九巴) 及 50 (城巴) 站號偵測工具 -->
  <div class="debug-section">
    <div class="debug-title">🔍 九巴 67M/67X & 城巴 50 全線站號偵測器</div>
    <div id="debugOutput">正在掃描路線站點...</div>
  </div>

  <script>
    const TARGET_STOPS = [
      { id: 'B17A07239E3E576E', ctbId: '002404', name: '堅拿道東 (往屯門過海線)' },
      { id: '001185', ctbId: '', name: '屯門公路轉車站 (往屯門方向)' }
    ];

    async function fetchKmbStopEta(kmbStopId) {
      if (!kmbStopId) return [];
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${kmbStopId}`);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.data || []).filter(i => i.eta).map(i => ({
          ...i,
          co: 'KMB',
          dest_tc: i.dest_tc || '目的地'
        }));
      } catch (err) {
        return [];
      }
    }

    async function fetchCtbEta(stopId, route) {
      if (!stopId) return [];
      try {
        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route}`);
        if (!res.ok) return [];
        const data = await res.json();
        return (data.data || []).filter(i => i.eta).map(i => ({
          ...i,
          co: 'CTB',
          dest_tc: i.dest_tc
        }));
      } catch (err) {
        return [];
      }
    }

    async function fetchStopAllRoutes(stopObj) {
      const kmbPromise = fetchKmbStopEta(stopObj.id);
      const ctbPromises = ['962X', '969', 'N962', '50'].map(r => fetchCtbEta(stopObj.ctbId, r));

      const [kmbResults, ctbResults] = await Promise.all([
        kmbPromise,
        Promise.all(ctbPromises)
      ]);

      let combined = [].concat(kmbResults);
      ctbResults.forEach(list => { combined = combined.concat(list); });

      return combined;
    }

    async function loadAllEta() {
      const container = document.getElementById('etaContainer');
      const selectedStopId = document.getElementById('stopSelector').value;
      const now = new Date();

      try {
        const filteredStops = selectedStopId === 'ALL' 
          ? TARGET_STOPS 
          : TARGET_STOPS.filter(s => s.id === selectedStopId);

        const promises = filteredStops.map(stopObj => fetchStopAllRoutes(stopObj));
        const results = await Promise.all(promises);

        let html = '';

        filteredStops.forEach((stop, index) => {
          const rawList = results[index] || [];

          html += `<div class="stop-group-title">${stop.name}</div>`;

          if (rawList.length > 0) {
            const routeMap = {};
            rawList.forEach(item => {
              if (!routeMap[item.route]) routeMap[item.route] = [];
              routeMap[item.route].push(item);
            });

            const routes = Object.keys(routeMap).sort((a, b) => parseInt(a) - parseInt(b));

            routes.forEach(routeName => {
              const matched = routeMap[routeName];
              matched.sort((a, b) => new Date(a.eta) - new Date(b.eta));

              const bus1 = matched[0];
              const bus2 = matched[1];

              const diff1 = Math.max(0, Math.round((new Date(bus1.eta) - now) / 60000));
              const timeStr1 = new Date(bus1.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

              let primaryStr = diff1 === 0 ? '即將到站' : `${diff1} 分鐘 <span style="font-size:11px;font-weight:normal;">(${timeStr1})</span>`;
              let secondEtaStr = '暫無次班';
              if (bus2 && bus2.eta) {
                const diff2 = Math.max(0, Math.round((new Date(bus2.eta) - now) / 60000));
                const timeStr2 = new Date(bus2.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                secondEtaStr = `次班: ${timeStr2} (${diff2}分)`;
              }

              const isCtb = bus1.co === 'CTB';
              const companyClass = isCtb ? 'ctb' : 'kmb';
              const tagText = isCtb ? '城巴' : '九巴';
              const tagClass = isCtb ? 'ctb-tag' : 'kmb-tag';

              html += `
                <div class="route-item ${companyClass}">
                  <div class="route-badge">
                    <span class="route-number">${routeName}</span>
                    <span class="company-tag ${tagClass}">${tagText}</span>
                  </div>
                  <div class="route-info">
                    <div class="dest-name">往 ${bus1.dest_tc || '目的地'}</div>
                  </div>
                  <div class="eta-times">
                    <div class="primary-eta">${primaryStr}</div>
                    <div class="secondary-eta">${secondEtaStr}</div>
                  </div>
                </div>
              `;
            });
          } else {
            html += `<div class="status-msg" style="padding: 12px; font-size: 13px;">暫無即時班次資料</div>`;
          }
        });

        container.innerHTML = html;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-msg">載入失敗，請稍後重試</div>`;
      }
    }

    // 掃描九巴 (67M, 67X) 及 城巴 (50) 雙向車站
    async function debugAllStops() {
      const debugDiv = document.getElementById('debugOutput');
      try {
        let fullHtml = '';

        // 1. 掃描城巴 50 號線 (Inbound & Outbound)
        const [res50In, res50Out] = await Promise.all([
          fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/50/inbound'),
          fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/50/outbound')
        ]);
        const data50In = await res50In.json();
        const data50Out = await res50Out.json();

        async function processCtbList(list, label) {
          if (!list || !list.data || list.data.length === 0) return `<div class="debug-sub-title">${label}：無數據</div>`;
          
          const promises = list.data.map(s => 
            fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`)
              .then(r => r.json())
              .then(d => ({ seq: s.seq, stop: s.stop, name: d.data ? d.data.name_tc : '未知車站' }))
              .catch(() => ({ seq: s.seq, stop: s.stop, name: '載入失敗' }))
          );

          const results = await Promise.all(promises);
          let subHtml = `<div class="debug-sub-title">${label} (${results.length} 個站)</div>`;

          results.forEach(item => {
            const isTarget = item.name.includes('欣田') || item.name.includes('兆康') || item.name.includes('和田') || item.name.includes('菁田') || item.name.includes('堅拿道');
            subHtml += `
              <div class="debug-row ${isTarget ? 'highlight' : ''}">
                <div><b>[${item.seq}]</b> ${item.name}</div>
                <div class="stop-id-tag">CTB: ${item.stop}</div>
              </div>
            `;
          });
          return subHtml;
        }

        fullHtml += await processCtbList(data50In, '城巴 50 往 尖沙咀東 (Inbound)');
        fullHtml += await processCtbList(data50Out, '城巴 50 往 屯門和田邨 (Outbound)');

        // 2. 掃描九巴 67M & 67X
        const [res67mIn, res67mOut, res67xIn, res67xOut] = await Promise.all([
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67M/inbound/1'),
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67M/outbound/1'),
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67X/inbound/1'),
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67X/outbound/1')
        ]);

        const data67mIn = await res67mIn.json();
        const data67mOut = await res67mOut.json();
        const data67xIn = await res67xIn.json();
        const data67xOut = await res67xOut.json();

        async function processKmbList(list, label) {
          if (!list || !list.data || list.data.length === 0) return `<div class="debug-sub-title">${label}：無數據</div>`;
          
          const promises = list.data.map(s => 
            fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`)
              .then(r => r.json())
              .then(d => ({ seq: s.seq, stop: s.stop, name: d.data ? d.data.name_tc : '未知車站' }))
              .catch(() => ({ seq: s.seq, stop: s.stop, name: '載入失敗' }))
          );

          const results = await Promise.all(promises);
          let subHtml = `<div class="debug-sub-title">${label} (${results.length} 個站)</div>`;

          results.forEach(item => {
            const isTarget = item.name.includes('兆康') || item.name.includes('欣田') || item.name.includes('紫田');
            subHtml += `
              <div class="debug-row ${isTarget ? 'highlight' : ''}">
                <div><b>[${item.seq}]</b> ${item.name}</div>
                <div class="stop-id-tag">KMB: ${item.stop}</div>
              </div>
            `;
          });
          return subHtml;
        }

        fullHtml += await processKmbList(data67mIn, '九巴 67M 往 葵芳');
        fullHtml += await processKmbList(data67mOut, '九巴 67M 往 兆康苑');
        fullHtml += await processKmbList(data67xIn, '九巴 67X 往 旺角東');
        fullHtml += await processKmbList(data67xOut, '九巴 67X 往 兆康苑');

        debugDiv.innerHTML = fullHtml;
      } catch (err) {
        debugDiv.innerHTML = '掃描失敗：' + err.message;
      }
    }

    loadAllEta();
    debugAllStops();
    setInterval(loadAllEta, 15000);
  </script>
</body>
</html>
