<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴全路線實時動態追蹤器 (KMB Tracker)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    .control-panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 10px 14px;
      border-radius: 8px; font-family: sans-serif; font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); max-width: 280px; width: 80%;
    }
    .control-panel select {
      padding: 6px 8px; font-size: 13px; margin: 4px 0; width: 100%;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
      background-color: white;
    }
    .status-text { margin-top: 6px; font-weight: bold; color: #333; font-size: 12px; }
    .eta-popup { font-family: sans-serif; font-size: 13px; line-height: 1.5; }
    .eta-popup b { color: #e60012; }
    .eta-item { margin-top: 4px; padding: 2px 0; border-bottom: 1px dashed #ccc; }
  </style>
</head>
<body>

  <div class="control-panel">
    <label><b>選擇九巴路線：</b></label>
    <select id="routeSelect" onchange="onRouteChanged()">
      <option value="">載入全港路線中...</option>
    </select>
    
    <label><b>選擇目的地：</b></label>
    <select id="boundSelect" onchange="loadSelectedBound()">
      <option value="">請先選擇路線...</option>
    </select>
    
    <div class="status-text" id="status">初始化系統數據中...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map').setView([22.375, 113.980], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let allStopsMap = {};
    let allRoutesData = [];
    let currentRouteStops = [];
    let busMarkers = [];
    let stopMarkers = [];
    let updateTimer = null;
    let currentRoute = '67M';

    const busIcon = L.divIcon({
      html: '<div style="background:#e60012;color:white;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-size:16px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.5);transition: all 1s linear;">🚌</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 初始化：載入車站與全港路線清單
    async function initSystem() {
      const statusEl = document.getElementById('status');
      try {
        // 1. 載入全港車站座標
        const stopRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const stopData = await stopRes.json();
        stopData.data.forEach(s => {
          allStopsMap[s.stop] = { lat: parseFloat(s.lat), lng: parseFloat(s.long), name: s.name_tc };
        });

        // 2. 載入全港九巴路線清單
        const routeRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route');
        const routeData = await routeRes.json();
        allRoutesData = routeData.data || [];

        // 整理不重複的路線名稱並排序
        const routeNames = [...new Set(allRoutesData.map(r => r.route))].sort((a, b) => 
          a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
        );

        const routeSelectEl = document.getElementById('routeSelect');
        routeSelectEl.innerHTML = '';
        routeNames.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r;
          opt.innerText = r;
          if (r === '67M') opt.selected = true; // 預設選擇 67M
          routeSelectEl.appendChild(opt);
        });

        statusEl.innerText = '全港路線載入完成！';
        onRouteChanged(); // 初始化載入預設路線 67M

      } catch (err) {
        console.error(err);
        statusEl.innerText = '載入系統資料失敗';
      }
    }

    // 當路線下拉選單改變時觸發
    function onRouteChanged() {
      const statusEl = document.getElementById('status');
      const routeSelectEl = document.getElementById('routeSelect');
      const selectedRoute = routeSelectEl.value;

      if (!selectedRoute) return;
      currentRoute = selectedRoute;
      statusEl.innerText = `載入 ${currentRoute} 方向中...`;

      // 篩選出該路線的所有方向 (只取 service_type === '1' 或全部)
      const routeMatches = allRoutesData.filter(r => r.route === currentRoute);
      const mainBounds = routeMatches.filter(r => r.service_type === '1');
      const boundsToUse = mainBounds.length > 0 ? mainBounds : routeMatches;

      const boundSelectEl = document.getElementById('boundSelect');
      boundSelectEl.innerHTML = '';

      boundsToUse.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.bound === 'O' ? 'outbound' : 'inbound';
        opt.dataset.serviceType = item.service_type;
        opt.innerText = `往：${item.dest_tc}`;
        boundSelectEl.appendChild(opt);
      });

      loadSelectedBound();
    }

    // 切換目的地方向並載入地圖
    async function loadSelectedBound() {
      const statusEl = document.getElementById('status');
      const selectEl = document.getElementById('boundSelect');
      const bound = selectEl.value;
      const selectedOpt = selectEl.options[selectEl.selectedIndex];
      const serviceType = selectedOpt ? selectedOpt.dataset.serviceType || '1' : '1';

      if (!bound) return;

      statusEl.innerText = `正在載入 ${currentRoute} 車站資料...`;

      if (updateTimer) clearInterval(updateTimer);
      clearMapLayers();

      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${currentRoute}/${bound}/${serviceType}`);
        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          statusEl.innerText = `無法載入 ${currentRoute} 車站資料`;
          return;
        }

        currentRouteStops = data.data;

        const pathCoords = [];
        currentRouteStops.forEach(st => {
          const coord = allStopsMap[st.stop];
          if (coord) {
            pathCoords.push([coord.lat, coord.lng]);

            const circle = L.circleMarker([coord.lat, coord.lng], {
              radius: 5, color: '#0055aa', fillColor: '#ffffff', fillOpacity: 1, weight: 2
            }).addTo(map);

            circle.bindPopup(`<b>${coord.name}</b><br>載入到站時間中...`);
            circle.on('click', async () => {
              const popupContent = await fetchStopEta(st.stop, currentRoute, coord.name);
              circle.getPopup().setContent(popupContent);
            });

            stopMarkers.push(circle);
          }
        });

        // 計算邊界自動對焦地圖 (隱藏線條)
        if (pathCoords.length > 0) {
          const tempPolyline = L.polyline(pathCoords);
          map.fitBounds(tempPolyline.getBounds(), { padding: [30, 30] });
        }

        await calculateBusPositions(currentRoute, bound, serviceType);
        updateTimer = setInterval(() => calculateBusPositions(currentRoute, bound, serviceType), 10000);

      } catch (err) {
        statusEl.innerText = `載入地圖失敗`;
      }
    }

    // 沿線內插推算巴士位置
    async function calculateBusPositions(route, bound, serviceType) {
      const statusEl = document.getElementById('status');
      try {
        const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/${serviceType}`);
        const etaData = await etaRes.json();
        if (!etaData.data) return;

        const now = new Date();
        const stopEtaMap = {};
        const targetDir = (bound === 'outbound') ? 'O' : 'I';

        etaData.data.forEach(item => {
          if (item.dir === targetDir && item.eta && item.seq) {
            const etaTime = new Date(item.eta);
            const diffMinutes = (etaTime - now) / 60000;
            if (diffMinutes >= -1 && diffMinutes <= 60) {
              if (!stopEtaMap[item.seq] || diffMinutes < stopEtaMap[item.seq].diffMinutes) {
                stopEtaMap[item.seq] = { diffMinutes: diffMinutes, dest: item.dest_tc };
              }
            }
          }
        });

        busMarkers.forEach(m => map.removeLayer(m));
        busMarkers = [];
        let busCount = 0;

        for (let i = 0; i < currentRouteStops.length - 1; i++) {
          const seqA = currentRouteStops[i].seq;
          const seqB = currentRouteStops[i + 1].seq;

          const etaA = stopEtaMap[seqA];
          const etaB = stopEtaMap[seqB];

          if (etaA && etaB && etaB.diffMinutes > etaA.diffMinutes) {
            const coordA = allStopsMap[currentRouteStops[i].stop];
            const coordB = allStopsMap[currentRouteStops[i + 1].stop];

            if (coordA && coordB) {
              const totalInterval = etaB.diffMinutes - etaA.diffMinutes;
              let ratio = 1 - (etaA.diffMinutes / (totalInterval || 1));
              ratio = Math.max(0, Math.min(1, ratio));

              const segment = turf.lineString([[coordA.lng, coordA.lat], [coordB.lng, coordB.lat]]);
              const lineDistance = turf.length(segment, { units: 'kilometers' });
              const targetPoint = turf.along(segment, lineDistance * ratio, { units: 'kilometers' });
              const [busLng, busLat] = targetPoint.geometry.coordinates;

              const marker = L.marker([busLat, busLng], { icon: busIcon })
                .addTo(map)
                .bindPopup(`<b>九巴 ${route} (推算車輛)</b><br>往：${etaA.dest}<br>介於：${coordA.name} ➔ ${coordB.name}<br>進度：${(ratio * 100).toFixed(0)}%`);

              busMarkers.push(marker);
              busCount++;
            }
          }
        }

        const selectEl = document.getElementById('boundSelect');
        const destName = selectEl.options[selectEl.selectedIndex] ? selectEl.options[selectEl.selectedIndex].text : '';
        statusEl.innerText = `${route} (${destName})：找到 ${busCount} 部巴士`;

      } catch (err) {
        statusEl.innerText = '推算位置發生錯誤';
      }
    }

    // 點擊車站查詢 ETA
    async function fetchStopEta(stopId, route, stopName) {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
        const data = await res.json();
        const etaList = (data.data || []).filter(item => item.route === route && item.eta);

        if (etaList.length === 0) {
          return `<div class="eta-popup"><b>${stopName}</b><br>暫無 ${route} 班次資料</div>`;
        }

        const nextTwoBuses = etaList.slice(0, 2);
        let html = `<div class="eta-popup"><b>${stopName} (${route})</b><br><b>預計到站時間：</b><br>`;
        nextTwoBuses.forEach((bus, index) => {
          const etaTime = new Date(bus.eta);
          const timeStr = etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const diffMin = Math.max(0, Math.round((etaTime - new Date()) / 60000));
          html += `<div class="eta-item">班次 ${index + 1}（往 ${bus.dest_tc}）：<b>${timeStr}</b> (${diffMin} 分鐘後)</div>`;
        });
        html += `</div>`;
        return html;

      } catch (err) {
        return `<div class="eta-popup"><b>${stopName}</b><br>載入失敗</div>`;
      }
    }

    function clearMapLayers() {
      busMarkers.forEach(m => map.removeLayer(m));
      stopMarkers.forEach(m => map.removeLayer(m));
      busMarkers = [];
      stopMarkers = [];
    }

    initSystem();
  </script>
</body>
</html>
