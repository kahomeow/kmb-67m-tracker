<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴全路線實時動態模擬地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    .control-panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 10px 14px;
      border-radius: 8px; font-family: sans-serif; font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); max-width: 300px;
    }
    .control-panel input, .control-panel select, .control-panel button {
      padding: 5px 8px; font-size: 13px; margin: 3px 0; width: 100%;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    .control-panel button {
      background-color: #e60012; color: white; border: none;
      font-weight: bold; cursor: pointer; margin-top: 6px;
    }
    .status-text { margin-top: 6px; font-weight: bold; color: #333; font-size: 12px; }
    .eta-popup { font-family: sans-serif; font-size: 13px; line-height: 1.5; }
    .eta-popup b { color: #e60012; }
    .eta-item { margin-top: 4px; padding: 2px 0; border-bottom: 1px dashed #ccc; }
  </style>
</head>
<body>

  <div class="control-panel">
    <label><b>輸入九巴路線：</b></label>
    <input type="text" id="routeInput" value="67M" placeholder="例: 67M, 58X, 960">
    
    <label><b>選擇方向：</b></label>
    <select id="boundSelect">
      <option value="outbound">去程 (Outbound)</option>
      <option value="inbound">回程 (Inbound)</option>
    </select>
    
    <button onclick="changeRoute()">搜尋並載入地圖</button>
    <div class="status-text" id="status">初始化全港車站數據中...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map').setView([22.375, 113.980], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let allStopsMap = {};   // 儲存全港所有車站座標
    let currentRouteStops = []; // 當前路線車站列表
    let busMarkers = [];     // 巴士 Marker 陣列
    let stopMarkers = [];    // 車站 Marker 陣列
    let routePolyline = null; // 路線畫線
    let updateTimer = null;

    const busIcon = L.divIcon({
      html: '<div style="background:#e60012;color:white;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-size:16px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.5);transition: all 1s linear;">🚌</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 初始化：載入全港所有車站基礎座標
    async function initSystem() {
      const statusEl = document.getElementById('status');
      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const data = await res.json();
        data.data.forEach(s => {
          allStopsMap[s.stop] = {
            lat: parseFloat(s.lat),
            lng: parseFloat(s.long),
            name: s.name_tc
          };
        });
        statusEl.innerText = '系統準備就緒，請搜尋路線。';
        changeRoute(); // 預設載入 67M
      } catch (err) {
        statusEl.innerText = '載入全港車站資料失敗';
      }
    }

    // 當使用者更換路線或方向時觸發
    async function changeRoute() {
      const statusEl = document.getElementById('status');
      const route = document.getElementById('routeInput').value.trim().toUpperCase();
      const bound = document.getElementById('boundSelect').value;

      if (!route) return;

      statusEl.innerText = `正在載入 ${route} 路線圖...`;

      if (updateTimer) clearInterval(updateTimer);

      // 清除舊圖層
      clearMapLayers();

      try {
        // 1. 取得該路線及方向的車站順序
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${bound}/1`);
        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          statusEl.innerText = `搵唔到路線 ${route} 的資料！`;
          return;
        }

        currentRouteStops = data.data;

        // 2. 在地圖畫出新車站與繪製 Polyline
        const pathCoords = [];
        currentRouteStops.forEach(st => {
          const coord = allStopsMap[st.stop];
          if (coord) {
            pathCoords.push([coord.lat, coord.lng]);

            const circle = L.circleMarker([coord.lat, coord.lng], {
              radius: 5, color: '#0055aa', fillColor: '#ffffff', fillOpacity: 1, weight: 2
            }).addTo(map);

            circle.bindPopup(`<b>${coord.name}</b><br>載入到站時間中...`);
            circle.on('click', async () => {
              const popupContent = await fetchStopEta(st.stop, route, coord.name);
              circle.getPopup().setContent(popupContent);
            });

            stopMarkers.push(circle);
          }
        });

        if (pathCoords.length > 0) {
          routePolyline = L.polyline(pathCoords, { color: '#ff3333', weight: 4, opacity: 0.6 }).addTo(map);
          map.fitBounds(routePolyline.getBounds(), { padding: [30, 30] }); // 地圖自動 Focus 到該路線
        }

        // 3. 立即推算巴士位置並啟動定時刷新
        await calculateBusPositions(route, bound);
        updateTimer = setInterval(() => calculateBusPositions(route, bound), 10000);

      } catch (err) {
        statusEl.innerText = `載入 ${route} 失敗`;
      }
    }

    // 推算實時巴士位置
    async function calculateBusPositions(route, bound) {
      const statusEl = document.getElementById('status');
      try {
        const serviceType = 1;
        const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/${serviceType}`);
        const etaData = await etaRes.json();
        if (!etaData.data) return;

        const now = new Date();
        const stopEtaMap = {};
        const targetDir = (bound === 'outbound') ? 'O' : 'I';

        etaData.data.forEach(item => {
          // 篩選對應方向與有效 ETA
          if (item.dir === targetDir && item.eta && item.seq) {
            const etaTime = new Date(item.eta);
            const diffMinutes = (etaTime - now) / 60000;
            if (diffMinutes >= -1 && diffMinutes <= 60) {
              if (!stopEtaMap[item.seq] || diffMinutes < stopEtaMap[item.seq].diffMinutes) {
                stopEtaMap[item.seq] = { diffMinutes: diffMinutes, dest: item.dest_tc };
              }
            }
          }
        });

        // 清除舊巴士 Marker
        busMarkers.forEach(m => map.removeLayer(m));
        busMarkers = [];
        let busCount = 0;

        // Turf.js 沿線內插計算
        for (let i = 0; i < currentRouteStops.length - 1; i++) {
          const seqA = currentRouteStops[i].seq;
          const seqB = currentRouteStops[i + 1].seq;

          const etaA = stopEtaMap[seqA];
          const etaB = stopEtaMap[seqB];

          if (etaA && etaB && etaB.diffMinutes > etaA.diffMinutes) {
            const coordA = allStopsMap[currentRouteStops[i].stop];
            const coordB = allStopsMap[currentRouteStops[i + 1].stop];

            if (coordA && coordB) {
              const totalInterval = etaB.diffMinutes - etaA.diffMinutes;
              let ratio = 1 - (etaA.diffMinutes / (totalInterval || 1));
              ratio = Math.max(0, Math.min(1, ratio));

              const segment = turf.lineString([[coordA.lng, coordA.lat], [coordB.lng, coordB.lat]]);
              const lineDistance = turf.length(segment, { units: 'kilometers' });
              const targetPoint = turf.along(segment, lineDistance * ratio, { units: 'kilometers' });
              const [busLng, busLat] = targetPoint.geometry.coordinates;

              const marker = L.marker([busLat, busLng], { icon: busIcon })
                .addTo(map)
                .bindPopup(`<b>九巴 ${route} (推算車輛)</b><br>往：${etaA.dest}<br>介於：${coordA.name} ➔ ${coordB.name}<br>進度：${(ratio * 100).toFixed(0)}%`);

              busMarkers.push(marker);
              busCount++;
            }
          }
        }

        statusEl.innerText = `${route} (${bound === 'outbound' ? '去程' : '回程'})：找到 ${busCount} 部巴士`;

      } catch (err) {
        statusEl.innerText = '推算位置發生錯誤';
      }
    }

    // 點擊車站查詢下兩班車 ETA
    async function fetchStopEta(stopId, route, stopName) {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
        const data = await res.json();
        const etaList = (data.data || []).filter(item => item.route === route && item.eta);

        if (etaList.length === 0) {
          return `<div class="eta-popup"><b>${stopName}</b><br>暫無 ${route} 班次資料</div>`;
        }

        const nextTwoBuses = etaList.slice(0, 2);
        let html = `<div class="eta-popup"><b>${stopName} (${route})</b><br><b>預計到站時間：</b><br>`;
        nextTwoBuses.forEach((bus, index) => {
          const etaTime = new Date(bus.eta);
          const timeStr = etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const diffMin = Math.max(0, Math.round((etaTime - new Date()) / 60000));
          html += `<div class="eta-item">班次 ${index + 1}（往 ${bus.dest_tc}）：<b>${timeStr}</b> (${diffMin} 分鐘後)</div>`;
        });
        html += `</div>`;
        return html;

      } catch (err) {
        return `<div class="eta-popup"><b>${stopName}</b><br>載入失敗</div>`;
      }
    }

    // 清除舊線路在地圖上的標記
    function clearMapLayers() {
      busMarkers.forEach(m => map.removeLayer(m));
      stopMarkers.forEach(m => map.removeLayer(m));
      if (routePolyline) map.removeLayer(routePolyline);
      busMarkers = [];
      stopMarkers = [];
      routePolyline = null;
    }

    // 啟動
    initSystem();
  </script>
</body>
</html>
