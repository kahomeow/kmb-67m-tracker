<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴 67M 實時追蹤</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    .status-box {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 8px 12px;
      border-radius: 8px; font-family: sans-serif; font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="status-box" id="status">搜尋 67M 巴士中...</div>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([22.375, 113.980], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let busMarkers = [];
    const stopCoords = {};

    // 紅底巴士 Icon
    const busIcon = L.divIcon({
      html: '<div style="background:#e60012;color:white;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-size:16px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.5);">🚌</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    async function initAndFetch() {
      const statusEl = document.getElementById('status');
      try {
        // 1. 取得所有車站座標
        if (Object.keys(stopCoords).length === 0) {
          const stopListRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
          const stopListData = await stopListRes.json();
          stopListData.data.forEach(s => {
            stopCoords[s.stop] = { lat: parseFloat(s.lat), lng: parseFloat(s.long), name: s.name_tc };
          });

          // 2. 畫出 67M 所有車站
          const routeRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67M/outbound/1');
          const routeData = await routeRes.json();
          routeData.data.forEach(st => {
            const coord = stopCoords[st.stop];
            if (coord) {
              L.circleMarker([coord.lat, coord.lng], {
                radius: 4, color: '#0055aa', fillColor: '#ffffff', fillOpacity: 1
              }).addTo(map).bindPopup(`車站：${coord.name}`);
            }
          });
        }

        // 3. 取得全線 ETA (去程與回程)
        const [etaOutbound, etaInbound] = await Promise.all([
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/67M/1').then(r => r.json()).catch(() => ({data:[]})),
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/67M/2').then(r => r.json()).catch(() => ({data:[]}))
        ]);

        const allEta = [...(etaOutbound.data || []), ...(etaInbound.data || [])];
        
        // 清除舊圖標
        busMarkers.forEach(m => map.removeLayer(m));
        busMarkers = [];

        const activeBuses = {};

        // 篩選最接近車站的車輛 (eta_seq === 1 代表下一班即將到達該站的車)
        allEta.forEach(item => {
          if (item.eta && item.stop && item.eta_seq === 1) {
            const coord = stopCoords[item.stop];
            if (coord) {
              // 以車站 + 目的地作為車輛識別 key
              const key = `${item.stop}_${item.dest_tc}`;
              activeBuses[key] = {
                lat: coord.lat,
                lng: coord.lng,
                stopName: coord.name,
                dest: item.dest_tc,
                etaTime: new Date(item.eta).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
              };
            }
          }
        });

        // 畫出巴士
        let count = 0;
        Object.keys(activeBuses).forEach(key => {
          const bus = activeBuses[key];
          const marker = L.marker([bus.lat, bus.lng], { icon: busIcon })
            .addTo(map)
            .bindPopup(`<b>九巴 67M</b><br>往：${bus.dest}<br>接近車站：${bus.stopName}<br>預計到站：${bus.etaTime}`);
          busMarkers.push(marker);
          count++;
        });

        statusEl.innerText = `已定圖 67M 巴士：${count} 部 (${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})})`;
      } catch (err) {
        console.error(err);
        statusEl.innerText = '更新失敗，請重新載入網頁';
      }
    }

    initAndFetch();
    setInterval(initAndFetch, 15000);
  </script>
</body>
</html>
