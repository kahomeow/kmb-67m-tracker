<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴 67M 沿道路軌跡實時模擬</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 引入 Turf.js 空間幾何計算庫 -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    .status-box {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 8px 12px;
      border-radius: 8px; font-family: sans-serif; font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="status-box" id="status">正在載入 67M 道路軌跡...</div>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([22.375, 113.980], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let busMarkers = [];
    const stopCoords = {};
    let routeStops = [];

    const busIcon = L.divIcon({
      html: '<div style="background:#e60012;color:white;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-size:16px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.5);transition: all 1s linear;">🚌</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    async function init() {
      const statusEl = document.getElementById('status');
      try {
        // 1. 載入所有車站座標
        const stopListRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const stopListData = await stopListRes.json();
        stopListData.data.forEach(s => {
          stopCoords[s.stop] = { lat: parseFloat(s.lat), lng: parseFloat(s.long), name: s.name_tc };
        });

        // 2. 載入 67M 車站順序
        const routeRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67M/outbound/1');
        const routeData = await routeRes.json();
        routeStops = routeData.data;

        // 3. 繪製車站點與連線路網 (Polyline)
        const pathCoords = [];
        routeStops.forEach(st => {
          const coord = stopCoords[st.stop];
          if (coord) {
            pathCoords.push([coord.lat, coord.lng]);
            L.circleMarker([coord.lat, coord.lng], {
              radius: 4, color: '#0055aa', fillColor: '#ffffff', fillOpacity: 1
            }).addTo(map).bindPopup(`車站：${coord.name}`);
          }
        });

        // 在地圖上畫出紅色道路幹線
        if (pathCoords.length > 0) {
          L.polyline(pathCoords, { color: '#ff3333', weight: 4, opacity: 0.6 }).addTo(map);
        }

        calculateBusPositionsPolyline();
      } catch (err) {
        console.error(err);
        statusEl.innerText = '載入數據失敗';
      }
    }

    async function calculateBusPositionsPolyline() {
      const statusEl = document.getElementById('status');
      try {
        const etaRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/67M/1');
        const etaData = await etaRes.json();
        if (!etaData.data) return;

        const now = new Date();
        const stopEtaMap = {};

        etaData.data.forEach(item => {
          if (item.eta && item.seq) {
            const etaTime = new Date(item.eta);
            const diffMinutes = (etaTime - now) / 60000;
            if (diffMinutes >= -1 && diffMinutes <= 60) {
              if (!stopEtaMap[item.seq] || diffMinutes < stopEtaMap[item.seq].diffMinutes) {
                stopEtaMap[item.seq] = { diffMinutes: diffMinutes, dest: item.dest_tc };
              }
            }
          }
        });

        busMarkers.forEach(m => map.removeLayer(m));
        busMarkers = [];
        let busCount = 0;

        for (let i = 0; i < routeStops.length - 1; i++) {
          const seqA = routeStops[i].seq;
          const seqB = routeStops[i + 1].seq;

          const etaA = stopEtaMap[seqA];
          const etaB = stopEtaMap[seqB];

          if (etaA && etaB && etaB.diffMinutes > etaA.diffMinutes) {
            const coordA = stopCoords[routeStops[i].stop];
            const coordB = stopCoords[routeStops[i + 1].stop];

            if (coordA && coordB) {
              const totalInterval = etaB.diffMinutes - etaA.diffMinutes;
              let ratio = 1 - (etaA.diffMinutes / (totalInterval || 1));
              ratio = Math.max(0, Math.min(1, ratio));

              // ---【核心 Turf.js 道路線段沿線定位邏輯】---
              // 1. 定義 A 站到 B 站的線段 (Turf LineString)
              const segment = turf.lineString([
                [coordA.lng, coordA.lat],
                [coordB.lng, coordB.lat]
              ]);
              
              // 2. 計算兩站之間線段長度 (公里)
              const lineDistance = turf.length(segment, { units: 'kilometers' });
              
              // 3. 沿著線段長度按 ratio 比例找出經緯度
              const targetPoint = turf.along(segment, lineDistance * ratio, { units: 'kilometers' });
              const [busLng, busLat] = targetPoint.geometry.coordinates;

              const marker = L.marker([busLat, busLng], { icon: busIcon })
                .addTo(map)
                .bindPopup(`<b>九巴 67M (沿路軌跡)</b><br>往：${etaA.dest}<br>介於：${coordA.name} ➔ ${coordB.name}<br>沿路線進度：${(ratio * 100).toFixed(0)}%`);

              busMarkers.push(marker);
              busCount++;
            }
          }
        }

        statusEl.innerText = `Turf.js 沿路線鎖定 ${busCount} 部 67M 巴士 (${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})})`;

      } catch (err) {
        console.error(err);
        statusEl.innerText = '推算位置時發生錯誤';
      }
    }

    init();
    setInterval(calculateBusPositionsPolyline, 10000);
  </script>
</body>
</html>
