<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴 67M 實時車輛追蹤</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map').setView([22.375, 113.980], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const busMarkers = {};

    async function fetchBusLocations() {
      try {
        const stopRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/67M/outbound/1');
        const stopData = await stopRes.json();
        
        for (const item of stopData.data.slice(0, 10)) {
          const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${item.stop}`);
          const etaData = await etaRes.json();
          const liveBuses = etaData.data.filter(eta => eta.route === '67M' && eta.lat && eta.long);

          liveBuses.forEach(bus => {
            const busKey = bus.rmk || `${bus.lat}_${bus.long}`;
            const lat = parseFloat(bus.lat);
            const lng = parseFloat(bus.long);

            if (busMarkers[busKey]) {
              busMarkers[busKey].setLatLng([lat, lng]);
            } else {
              busMarkers[busKey] = L.marker([lat, lng])
                .addTo(map)
                .bindPopup(`<b>九巴 67M</b><br>往：${bus.dest_tc}`);
            }
          });
        }
      } catch (err) {
        console.error('更新失敗:', err);
      }
    }

    fetchBusLocations();
    setInterval(fetchBusLocations, 15000);
  </script>
</body>
</html>
